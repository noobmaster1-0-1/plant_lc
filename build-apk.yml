name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            build-essential autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Create Buildozer spec
        run: |
          buildozer init
          sed -i 's/^title = .*/title = Plant Maintenance Survey/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = plantsurvey/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.ruet.plantsurvey/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,kv,png,jpg,atlas,db/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.1,openpyxl==3.1.5/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/' buildozer.spec
          echo 'android.api = 33' >> buildozer.spec
          echo 'android.minapi = 23' >> buildozer.spec
          echo 'android.archs = arm64-v8a' >> buildozer.spec
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk
          path: bin/*.apk
