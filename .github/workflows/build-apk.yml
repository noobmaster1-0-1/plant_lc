
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          content = path.read_text()

          start = content.index("[app]")
          end = content.find("\n[", start + 1)
          if end == -1:
              end = len(content)

          section = content[start:end]

          settings = {
              "title": "Plant Maintenance Survey",
              "package.name": "plantsurvey",
              "package.domain": "org.ruet",
              "source.dir": ".",
              "source.include_exts": "py,kv,png,jpg,atlas,db",
              "requirements": "python3,kivy==2.3.1,openpyxl==3.1.5",
              "orientation": "portrait",
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "23",
              "android.ndk": "25b",
              "android.ndk_api": "23",
              "android.archs": "arm64-v8a",
              "log_level": "2",
          }

          for key, value in settings.items():
              pattern = rf"(?m)^\s*#?\s*{re.escape(key)}\s*=.*$"
              replacement = f"{key} = {value}"

              if re.search(pattern, section):
                  section = re.sub(pattern, replacement, section, count=1)
              else:
                  section += f"\n{replacement}"

          path.write_text(content[:start] + section + content[end:])
          print(section)
          PY

      - name: Verify configuration
        run: |
          grep -E 'android.accept_sdk_license|android.ndk =|android.api =|android.archs =|log_level =' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        shell: bash

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk
          path: bin/*.apk
          if-no-files-found: error
