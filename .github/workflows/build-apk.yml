
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Patch Python-for-Android for Android grp compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import pythonforandroid.recipes.python3 as python3_recipe

          recipe_file = Path(python3_recipe.__file__)
          recipe = recipe_file.read_text(encoding="utf-8")

          marker = "        with current_directory(build_dir):"

          if "PLANT_SURVEY_ANDROID_GRP_WORKAROUND" not in recipe:

              patch = r'''
                  # PLANT_SURVEY_ANDROID_GRP_WORKAROUND
                  # Patch CPython after its source has been downloaded,
                  # but before its Android compilation begins.

                  grpmodule = join(recipe_build_dir, 'Modules', 'grpmodule.c')

                  if not exists(grpmodule):
                      raise BuildInterruptingException(
                          "Could not locate CPython Modules/grpmodule.c"
                      )

                  with open(grpmodule, 'r', encoding='utf-8') as f:
                      source = f.read()

                  old = (
                      "    if ((d = PyList_New(0)) == NULL)\n"
                      "        return NULL;\n"
                      "    setgrent();\n"
                      "    while ((p = getgrent()) != NULL) {\n"
                      "        PyObject *v = mkgrent(module, p);\n"
                      "        if (v == NULL || PyList_Append(d, v) != 0) {\n"
                      "            Py_XDECREF(v);\n"
                      "            Py_DECREF(d);\n"
                      "            endgrent();\n"
                      "            return NULL;\n"
                      "        }\n"
                      "        Py_DECREF(v);\n"
                      "    }\n"
                      "    endgrent();\n"
                      "    return d;\n"
                  )

                  new = (
                      "    if ((d = PyList_New(0)) == NULL)\n"
                      "        return NULL;\n"
                      "#ifdef __ANDROID__\n"
                      "    /* PLANT_SURVEY_ANDROID_GRP_WORKAROUND */\n"
                      "    /* Android Bionic does not provide getgrent(). */\n"
                      "    return d;\n"
                      "#else\n"
                      "    setgrent();\n"
                      "    while ((p = getgrent()) != NULL) {\n"
                      "        PyObject *v = mkgrent(module, p);\n"
                      "        if (v == NULL || PyList_Append(d, v) != 0) {\n"
                      "            Py_XDECREF(v);\n"
                      "            Py_DECREF(d);\n"
                      "            endgrent();\n"
                      "            return NULL;\n"
                      "        }\n"
                      "        Py_DECREF(v);\n"
                      "    }\n"
                      "    endgrent();\n"
                      "    return d;\n"
                      "#endif\n"
                  )

                  if old not in source:
                      if "PLANT_SURVEY_ANDROID_GRP_WORKAROUND" not in source:
                          raise BuildInterruptingException(
                              "Could not find expected CPython grp source block."
                          )
                  else:
                      source = source.replace(old, new, 1)

                      with open(grpmodule, 'w', encoding='utf-8') as f:
                          f.write(source)

                      info("Successfully patched CPython grp module for Android.")
              '''

              if marker not in recipe:
                  raise RuntimeError(
                      "Could not find the expected Python-for-Android build hook."
                  )

              recipe = recipe.replace(marker, patch + "\n" + marker, 1)
              recipe_file.write_text(recipe, encoding="utf-8")

          print("Python-for-Android workaround installed.")
          print("Patched recipe:", recipe_file)
          PY

      - name: Initialize Buildozer
        run: |
          buildozer init

      - name: Configure application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          content = path.read_text()

          start = content.index("[app]")
          end = content.find("\n[", start + 1)

          if end == -1:
              end = len(content)

          section = content[start:end]

          settings = {
              "title": "Plant Maintenance Survey",
              "package.name": "plantsurvey",
              "package.domain": "org.ruet",
              "source.dir": ".",
              "source.include_exts": "py,kv,png,jpg,atlas,db",
              "requirements": "python3==3.12.9,hostpython3==3.12.9,kivy==2.3.1,openpyxl==3.1.5",
              "orientation": "portrait",
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "p4a.branch": "master",
              "log_level": "2",
          }

          for key, value in settings.items():
              pattern = rf"(?m)^\s*#?\s*{re.escape(key)}\s*=.*$"
              replacement = f"{key} = {value}"

              if re.search(pattern, section):
                  section = re.sub(
                      pattern, replacement, section, count=1
                  )
              else:
                  section += f"\n{replacement}"

          content = content[:start] + section + content[end:]
          path.write_text(content)

          print("Configured buildozer.spec:")
          print(section)
          PY

      - name: Verify configuration
        run: |
          grep -E 'requirements =|p4a.branch|android.accept_sdk_license|android.api =|android.minapi =|android.ndk_api =' buildozer.spec

      - name: Clean previous Android build
        run: |
          buildozer android clean || true

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
        shell: bash

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk
          path: bin/*.apk
          if-no-files-found: error
