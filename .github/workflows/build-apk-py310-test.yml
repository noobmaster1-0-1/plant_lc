
name: Test APK - Python 3.10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize Buildozer
        run: |
          buildozer init

      - name: Configure application
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text().splitlines()

          in_app = False
          found = False

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_app = (stripped == "[app]")
                  continue

              if (
                  in_app
                  and not stripped.startswith("#")
                  and stripped.startswith("requirements")
                  and "=" in stripped
              ):
                  lines[i] = (
                      "requirements = "
                      "python3==3.10.11,hostpython3==3.10.11,"
                      "kivy==2.3.1,openpyxl==3.1.5"
                  )
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "ERROR: Active requirements setting not found in [app]."
              )

          path.write_text("\n".join(lines) + "\n")

          print("Updated buildozer.spec requirements:")
          for line in lines:
              stripped = line.strip()
              if (
                  stripped.startswith("requirements")
                  and not stripped.startswith("#")
              ):
                  print(stripped)
          PY

      - name: Verify Python configuration
        run: |
          echo "Checking buildozer.spec..."

          grep -n "^requirements =" buildozer.spec

          grep -q "^requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5$" buildozer.spec

          echo "Python 3.10.11 configuration verified."

      - name: Clean previous Android build
        run: |
          buildozer android clean || true

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
        shell: bash

      - name: Verify actual Android Python version
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "Build log not found."
            exit 1
          fi

          echo "Checking actual python-for-android build command..."

          if grep -F -- '--requirements=python3==3.10.11,hostpython3==3.10.11' build.log; then
            echo "Confirmed: Android build used Python 3.10.11."
          else
            echo "ERROR: Python 3.10.11 was not used."
            echo "Do not install any APK from this run."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-py310-test
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk-py310-test
          path: bin/*.apk
          if-no-files-found: error
