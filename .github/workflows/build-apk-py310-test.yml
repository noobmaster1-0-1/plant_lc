
name: Test APK - Python 3.10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Generate fresh Buildozer configuration
        run: |
          rm -f buildozer.spec
          buildozer init

      - name: Configure application
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text().splitlines()

          settings = {
              "title": "Plant Maintenance Survey",
              "package.name": "plantsurvey",
              "package.domain": "org.ruet",
              "source.dir": ".",
              "source.include_exts": "py,kv,png,jpg,atlas,db",
              "requirements": (
                  "python3==3.10.11,hostpython3==3.10.11,"
                  "kivy==2.3.1,openpyxl==3.1.5"
              ),
              "orientation": "portrait",
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "p4a.branch": "master",
              "log_level": "2",
          }

          in_app = False
          found = set()

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_app = stripped == "[app]"
                  continue

              if not in_app or stripped.startswith("#") or "=" not in stripped:
                  continue

              key = stripped.split("=", 1)[0].strip()

              if key in settings:
                  lines[i] = f"{key} = {settings[key]}"
                  found.add(key)

          missing = set(settings) - found

          if missing:
              raise SystemExit(f"Missing settings: {sorted(missing)}")

          path.write_text("\n".join(lines) + "\n")

          print("Generated configuration:")
          print(path.read_text())
          PY

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5"

          grep -Fx "$EXPECTED" buildozer.spec

          echo "Configuration verified."

      - name: Remove all previous Android build caches
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin

          echo "Previous Android distributions and build files removed."

      - name: Final configuration check
        shell: bash
        run: |
          set -euo pipefail

          echo "Final build configuration:"
          grep -nE '^(requirements|package.name|p4a.branch|android.api|android.minapi|android.ndk_api) =' buildozer.spec

          grep -q '^requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5$' buildozer.spec

          echo "Ready to build."

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify Android Python version
        if: always()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "Build log missing."
            exit 1
          fi

          if grep -F -- '--requirements=python3==3.10.11,hostpython3==3.10.11' build.log; then
            echo "Android build requested Python 3.10.11."
          else
            echo "ERROR: Android build did not request Python 3.10.11."
            exit 1
          fi

      - name: Verify APK Python library
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find bin -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi

          echo "Inspecting APK: $APK"

          unzip -l "$APK" > apk_contents.txt

          if grep -q 'libpython3.10.so' apk_contents.txt; then
            echo "SUCCESS: Python 3.10 library found."
          else
            echo "ERROR: Python 3.10 library not found."
            grep 'libpython' apk_contents.txt || true
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-py310-test
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk-py310-test
          path: bin/*.apk
          if-no-files-found: error
