
name: Build APK - Python 3.12 Startup Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Generate fresh Buildozer configuration
        run: |
          rm -f buildozer.spec
          buildozer init

      - name: Download python-for-android
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          echo "python-for-android commit:"
          git -C "$GITHUB_WORKSPACE/python-for-android" rev-parse HEAD

      - name: Patch Android Python startup paths
        shell: bash
        run: |
          set -euo pipefail

          START_C="$GITHUB_WORKSPACE/python-for-android/pythonforandroid/bootstraps/common/build/jni/application/src/start.c"

          if [ ! -f "$START_C" ]; then
            echo "ERROR: start.c not found."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path(
              "python-for-android/pythonforandroid/bootstraps/"
              "common/build/jni/application/src/start.c"
          )

          source = path.read_text()

          old = """            wchar_t wchar_zip_path[256];
            wchar_t wchar_modules_path[256];
            swprintf(wchar_zip_path, 256, L"%s/stdlib.zip", python_bundle_dir);
            swprintf(wchar_modules_path, 256, L"%s/modules", python_bundle_dir);
            config.module_search_paths_set = 1;
            PyWideStringList_Append(&config.module_search_paths, wchar_zip_path);
            PyWideStringList_Append(&config.module_search_paths, wchar_modules_path);"""

          new = """            char zip_path[256];
            char modules_path[256];

            snprintf(zip_path, sizeof(zip_path),
                     "%s/stdlib.zip", python_bundle_dir);
            snprintf(modules_path, sizeof(modules_path),
                     "%s/modules", python_bundle_dir);

            wchar_t *wchar_zip_path = Py_DecodeLocale(zip_path, NULL);
            wchar_t *wchar_modules_path = Py_DecodeLocale(modules_path, NULL);

            if (wchar_zip_path == NULL || wchar_modules_path == NULL) {
                LOGP("ERROR: Failed to decode Python bundle paths.");

                if (wchar_zip_path != NULL) {
                    PyMem_RawFree(wchar_zip_path);
                }

                if (wchar_modules_path != NULL) {
                    PyMem_RawFree(wchar_modules_path);
                }

                PyConfig_Clear(&config);
                return -1;
            }

            config.module_search_paths_set = 1;

            PyStatus zip_status = PyWideStringList_Append(
                &config.module_search_paths, wchar_zip_path);

            PyStatus modules_status = PyWideStringList_Append(
                &config.module_search_paths, wchar_modules_path);

            PyMem_RawFree(wchar_zip_path);
            PyMem_RawFree(wchar_modules_path);

            if (PyStatus_Exception(zip_status) ||
                PyStatus_Exception(modules_status)) {
                LOGP("ERROR: Failed to configure Python module search paths.");
                PyConfig_Clear(&config);
                return -1;
            }"""

          if old not in source:
              raise SystemExit(
                  "ERROR: Original startup code did not match. "
                  "No patch was applied."
              )

          source = source.replace(old, new, 1)
          path.write_text(source)

          print("Startup path patch applied.")
          PY

          echo "Verifying patched source..."

          if grep -F 'swprintf(wchar_zip_path' "$START_C"; then
            echo "ERROR: Original unsafe code remains."
            exit 1
          fi

          grep -F 'Py_DecodeLocale(zip_path' "$START_C"
          grep -F 'Py_DecodeLocale(modules_path' "$START_C"
          grep -F 'Failed to decode Python bundle paths.' "$START_C"

          echo "PATCH VERIFIED."

      - name: Configure application
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text().splitlines()

          settings = {
              "title": "Plant Maintenance Survey",
              "package.name": "plantsurvey",
              "package.domain": "org.ruet",
              "source.dir": ".",
              "source.include_exts": "py,kv,png,jpg,atlas,db",
              "requirements": (
                  "python3==3.12.9,hostpython3==3.12.9,"
                  "kivy==2.3.1,openpyxl==3.1.5"
              ),
              "orientation": "portrait",
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "p4a.branch": "master",
              "p4a.source_dir": str(
                  (Path.cwd() / "python-for-android").resolve()
              ),
              "log_level": "2",
          }

          in_app = False
          found = set()

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_app = stripped == "[app]"
                  continue

              if not in_app or stripped.startswith("#") or "=" not in stripped:
                  continue

              key = stripped.split("=", 1)[0].strip()

              if key in settings:
                  lines[i] = f"{key} = {settings[key]}"
                  found.add(key)

          missing = set(settings) - found

          if missing:
              raise SystemExit(f"Missing settings: {sorted(missing)}")

          path.write_text("\n".join(lines) + "\n")

          print("Generated configuration:")
          print(path.read_text())
          PY

      - name: Verify Buildozer uses patched source
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_DIR="$(realpath python-for-android)"
          CONFIGURED_DIR="$(sed -n 's/^p4a.source_dir = //p' buildozer.spec | tail -n 1)"

          echo "Expected source: $EXPECTED_DIR"
          echo "Configured source: $CONFIGURED_DIR"

          test "$EXPECTED_DIR" = "$CONFIGURED_DIR"
          test -f "$CONFIGURED_DIR/pythonforandroid/bootstraps/common/build/jni/application/src/start.c"

          grep -F 'Py_DecodeLocale(zip_path' \
            "$CONFIGURED_DIR/pythonforandroid/bootstraps/common/build/jni/application/src/start.c"

          if grep -F 'swprintf(wchar_zip_path' \
            "$CONFIGURED_DIR/pythonforandroid/bootstraps/common/build/jni/application/src/start.c"; then
            echo "ERROR: Unpatched source selected."
            exit 1
          fi

          echo "Buildozer source directory verified."

      - name: Remove previous Android build files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin

          echo "Clean Android build directories prepared."
          echo "Patched python-for-android checkout preserved."

      - name: Final configuration check
        shell: bash
        run: |
          set -euo pipefail

          echo "Final build configuration:"
          grep -nE '^(requirements|package.name|p4a.branch|p4a.source_dir|android.api|android.minapi|android.ndk_api) =' buildozer.spec

          grep -q '^requirements = python3==3.12.9,hostpython3==3.12.9,kivy==2.3.1,openpyxl==3.1.5$' buildozer.spec

          echo "Ready to build."

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify Android Python version
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build.log ]; then
            echo "Build log missing."
            exit 1
          fi

          if grep -F -- '--requirements=python3==3.12.9,hostpython3==3.12.9' build.log; then
            echo "Android build requested Python 3.12.9."
          else
            echo "ERROR: Android build did not request Python 3.12.9."
            exit 1
          fi

      - name: Verify compiled APK contains startup patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find bin -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "Inspecting APK: $APK"

          unzip -l "$APK" > apk_contents.txt

          grep -q 'libpython3.12.so' apk_contents.txt
          grep -q 'libmain.so' apk_contents.txt

          unzip -p "$APK" lib/arm64-v8a/libmain.so > libmain.so

          if strings libmain.so | grep -F 'Failed to decode Python bundle paths.'; then
            echo "SUCCESS: Patched startup code is inside the APK."
          else
            echo "ERROR: Patch marker missing from compiled libmain.so."
            exit 1
          fi

          echo "APK verification completed."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-startup-fix
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk-startup-fix
          path: bin/*.apk
          if-no-files-found: error
