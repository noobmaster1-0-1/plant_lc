
name: Test APK - Python 3.10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize Buildozer
        run: |
          buildozer init

      - name: Configure application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text().splitlines()

          in_app = False
          found = False

          settings = {
              "title": "Plant Maintenance Survey",
              "package.name": "plantsurvey",
              "package.domain": "org.ruet",
              "source.dir": ".",
              "source.include_exts": "py,kv,png,jpg,atlas,db",
              "requirements": "python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5",
              "orientation": "portrait",
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "p4a.branch": "master",
              "log_level": "2",
          }

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_app = stripped == "[app]"
                  continue

              if not in_app or stripped.startswith("#") or "=" not in stripped:
                  continue

              key = stripped.split("=", 1)[0].strip()

              if key in settings:
                  lines[i] = f"{key} = {settings[key]}"

                  if key == "requirements":
                      found = True

          if not found:
              raise SystemExit(
                  "ERROR: Active requirements setting not found in [app]."
              )

          path.write_text("\n".join(lines) + "\n")

          print("Configured buildozer.spec:")
          for line in lines:
              if line.strip().startswith("requirements"):
                  print(line.strip())
          PY

      - name: Verify initial configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -n "^requirements =" buildozer.spec

          grep -q "^requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5$" buildozer.spec

          echo "Initial Python configuration verified."

      - name: Clean previous Android build
        run: |
          buildozer android clean || true

      - name: Force Android Python version
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying final requirements override..."

          sed -i -E \
            '/^[[:space:]]*requirements[[:space:]]*=/c\requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5' \
            buildozer.spec

          echo "Final buildozer.spec requirements:"
          grep -n "^requirements =" buildozer.spec

          grep -q "^requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.1,openpyxl==3.1.5$" buildozer.spec

          echo "Final requirements override verified."

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify actual Android Python version
        if: always()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "ERROR: Build log not found."
            exit 1
          fi

          echo "Checking actual python-for-android build command..."

          if grep -F -- '--requirements=python3==3.10.11,hostpython3==3.10.11' build.log; then
            echo "SUCCESS: Android build requested Python 3.10.11."
          else
            echo "ERROR: Android build did not request Python 3.10.11."
            echo "Do not install any APK from this run."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-py310-test
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk-py310-test
          path: bin/*.apk
          if-no-files-found: error
