
name: Build APK - Python 3.12 Startup Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Generate fresh Buildozer configuration
        run: |
          rm -f buildozer.spec
          buildozer init

      - name: Configure application
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text().splitlines()

          settings = {
              "title": "Plant Maintenance Survey",
              "package.name": "plantsurvey",
              "package.domain": "org.ruet",
              "source.dir": ".",
              "source.include_exts": "py,kv,png,jpg,atlas,db",
              "requirements": (
                  "python3==3.12.9,hostpython3==3.12.9,"
                  "kivy==2.3.1,openpyxl==3.1.5"
              ),
              "orientation": "portrait",
              "android.accept_sdk_license": "True",
              "android.api": "33",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "p4a.branch": "master",
              "log_level": "2",
          }

          in_app = False
          found = set()

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_app = stripped == "[app]"
                  continue

              if not in_app or stripped.startswith("#") or "=" not in stripped:
                  continue

              key = stripped.split("=", 1)[0].strip()

              if key in settings:
                  lines[i] = f"{key} = {settings[key]}"
                  found.add(key)

          missing = set(settings) - found

          if missing:
              raise SystemExit(f"Missing settings: {sorted(missing)}")

          path.write_text("\n".join(lines) + "\n")

          print("Generated configuration:")
          print(path.read_text())
          PY

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="requirements = python3==3.12.9,hostpython3==3.12.9,kivy==2.3.1,openpyxl==3.1.5"

          grep -Fx "$EXPECTED" buildozer.spec

          echo "Python 3.12.9 configuration verified."

      - name: Remove previous Android build files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer/android/platform

          echo "Clean build directories prepared."

      - name: Download and patch python-for-android
        shell: bash
        run: |
          set -euo pipefail

          P4A_DIR=".buildozer/android/platform/python-for-android"

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          START_C="$P4A_DIR/pythonforandroid/bootstraps/common/build/jni/application/src/start.c"

          if [ ! -f "$START_C" ]; then
            echo "ERROR: python-for-android start.c was not found."
            exit 1
          fi

          echo "python-for-android commit:"
          git -C "$P4A_DIR" rev-parse HEAD

          python - <<'PY'
          from pathlib import Path

          path = Path(
              ".buildozer/android/platform/python-for-android/"
              "pythonforandroid/bootstraps/common/build/jni/"
              "application/src/start.c"
          )

          source = path.read_text()

          old = """            wchar_t wchar_zip_path[256];
            wchar_t wchar_modules_path[256];
            swprintf(wchar_zip_path, 256, L"%s/stdlib.zip", python_bundle_dir);
            swprintf(wchar_modules_path, 256, L"%s/modules", python_bundle_dir);
            config.module_search_paths_set = 1;
            PyWideStringList_Append(&config.module_search_paths, wchar_zip_path);
            PyWideStringList_Append(&config.module_search_paths, wchar_modules_path);"""

          new = """            char zip_path[256];
            char modules_path[256];

            snprintf(zip_path, sizeof(zip_path),
                     "%s/stdlib.zip", python_bundle_dir);
            snprintf(modules_path, sizeof(modules_path),
                     "%s/modules", python_bundle_dir);

            wchar_t *wchar_zip_path = Py_DecodeLocale(zip_path, NULL);
            wchar_t *wchar_modules_path = Py_DecodeLocale(modules_path, NULL);

            if (wchar_zip_path == NULL || wchar_modules_path == NULL) {
                LOGP("ERROR: Failed to decode Python bundle paths.");
                if (wchar_zip_path != NULL) {
                    PyMem_RawFree(wchar_zip_path);
                }
                if (wchar_modules_path != NULL) {
                    PyMem_RawFree(wchar_modules_path);
                }
            } else {
                config.module_search_paths_set = 1;

                PyWideStringList_Append(
                    &config.module_search_paths, wchar_zip_path);
                PyWideStringList_Append(
                    &config.module_search_paths, wchar_modules_path);

                PyMem_RawFree(wchar_zip_path);
                PyMem_RawFree(wchar_modules_path);
            }"""

          if old not in source:
              raise SystemExit(
                  "ERROR: Expected original path-construction code "
                  "was not found. Refusing to build with an unpatched "
                  "python-for-android source."
              )

          source = source.replace(old, new, 1)
          path.write_text(source)

          print("Patched start.c successfully.")
          PY

          echo "Verifying patched source..."

          if grep -n 'swprintf(wchar_zip_path' "$START_C"; then
            echo "ERROR: Original unsafe path code remains."
            exit 1
          fi

          grep -n 'Py_DecodeLocale(zip_path' "$START_C"
          grep -n 'Py_DecodeLocale(modules_path' "$START_C"

          echo "python-for-android startup path patch verified."

      - name: Final configuration check
        shell: bash
        run: |
          set -euo pipefail

          echo "Final build configuration:"
          grep -nE '^(requirements|package.name|p4a.branch|android.api|android.minapi|android.ndk_api) =' buildozer.spec

          grep -q '^requirements = python3==3.12.9,hostpython3==3.12.9,kivy==2.3.1,openpyxl==3.1.5$' buildozer.spec

          echo "Ready to build."

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify Android Python version
        if: always()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "Build log missing."
            exit 1
          fi

          if grep -F -- '--requirements=python3==3.12.9,hostpython3==3.12.9' build.log; then
            echo "Android build requested Python 3.12.9."
          else
            echo "ERROR: Android build did not request Python 3.12.9."
            exit 1
          fi

      - name: Verify APK and patched startup code
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find bin -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi

          echo "Inspecting APK: $APK"

          unzip -l "$APK" > apk_contents.txt

          if grep -q 'libpython3.12.so' apk_contents.txt; then
            echo "SUCCESS: Python 3.12 library found."
          else
            echo "ERROR: Python 3.12 library not found."
            grep 'libpython' apk_contents.txt || true
            exit 1
          fi

          if grep -q 'libmain.so' apk_contents.txt; then
            echo "SUCCESS: Android bootstrap library found."
          else
            echo "ERROR: libmain.so not found."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-path-fix
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-survey-apk-path-fix
          path: bin/*.apk
          if-no-files-found: error
